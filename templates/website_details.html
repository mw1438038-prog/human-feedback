
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Details - HUMAN FEEDBACK</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        :root {
            --navy: #172554;
            --navy-dark: #101B40;
            --orange: #F97316;
            --orange-dark: #EA580C;
            --text: #263247;
            --muted: #718096;
            --border: #E5EAF1;
            --background: #F8FAFC;
            --white: #FFFFFF;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--background);
            color: var(--text);
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        a { color: inherit; text-decoration: none; }

        .app-layout { min-height: 100vh; display: flex; }

        .sidebar {
            width: 255px;
            background: var(--navy-dark);
            color: white;
            padding: 25px 17px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .brand {
            font-size: 21px;
            font-weight: 800;
            padding: 0 12px 30px;
            letter-spacing: -.5px;
        }

        .brand span { color: var(--orange); }

        .sidebar-label {
            color: #8E9AB8;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.3px;
            padding: 13px 12px 9px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 9px;
            color: #C5CEE0;
            font-size: 13px;
            margin-bottom: 4px;
            transition: .2s;
        }

        .nav-link:hover, .nav-link.active {
            background: rgba(255,255,255,.10);
            color: white;
        }

        .nav-link.active {
            border-left: 3px solid var(--orange);
            padding-left: 9px;
        }

        .nav-icon { width: 19px; text-align: center; }

        .sidebar-bottom {
            margin-top: auto;
            border-top: 1px solid rgba(255,255,255,.12);
            padding-top: 18px;
        }

        .user-box { display: flex; align-items: center; gap: 10px; padding: 10px; }
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #FDE7D7;
            color: #9A3412;
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: 13px;
        }

        .user-name { font-size: 12px; font-weight: 700; }
        .user-plan { font-size: 10px; color: #AAB5CC; margin-top: 3px; }

        .main-content { flex: 1; min-width: 0; }

        .topbar {
            height: 72px;
            background: white;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
        }

        .breadcrumb { color: var(--muted); font-size: 12px; }
        .breadcrumb strong { color: var(--navy); }
        .topbar-right { display: flex; align-items: center; gap: 20px; }
        .top-icon { color: #64748B; font-size: 19px; }

        .top-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #FDE7D7;
            color: #9A3412;
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: 12px;
        }

        .content { max-width: 1180px; padding: 32px 35px 55px; margin: auto; }

        .page-heading {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 24px;
        }

        .page-heading h1 {
            color: var(--navy);
            font-size: 27px;
            margin: 0 0 8px;
            letter-spacing: -.7px;
        }

        .page-heading p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; }

        .heading-actions { display: flex; gap: 9px; flex-wrap: wrap; }

        .btn {
            border: 0;
            border-radius: 8px;
            padding: 11px 15px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            display: inline-block;
        }

        .btn-secondary { background: white; border: 1px solid var(--border); color: #475569; }
        .btn-primary { background: var(--orange); color: white; }
        .btn-primary:hover { background: var(--orange-dark); }

        .-notice {
            background: #FFF7ED;
            border: 1px solid #FED7AA;
            color: #9A3412;
            border-radius: 9px;
            padding: 12px 15px;
            font-size: 11px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .website-hero {
            background: white;
            border: 1px solid var(--border);
            border-radius: 13px;
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 21px;
        }

        .website-identity { display: flex; align-items: center; gap: 16px; min-width: 0; }

        .website-logo {
            width: 58px;
            height: 58px;
            flex-shrink: 0;
            border-radius: 13px;
            background: #FFF0E4;
            color: var(--orange-dark);
            display: grid;
            place-items: center;
            font-size: 24px;
            font-weight: 800;
        }

        .website-name { color: var(--navy); font-size: 19px; font-weight: 800; margin: 0 0 7px; }
        .website-url { color: #64748B; font-size: 11px; word-break: break-all; }
        .website-meta { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 10px; }

        .tag {
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 9px;
            font-weight: 700;
            background: #F1F5F9;
            color: #526176;
        }

        .tag-approved { background: #ECFDF5; color: #047857; }
        .tag-category { background: #EFF6FF; color: #1D4ED8; }

        .hero-status { text-align: right; flex-shrink: 0; }
        .hero-status small { display: block; color: var(--muted); font-size: 10px; margin-bottom: 7px; }
        .status-approved {
            display: inline-block;
            background: #ECFDF5;
            color: #047857;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 800;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 22px;
        }

        .stat-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 11px;
            padding: 18px;
        }

        .stat-label { color: var(--muted); font-size: 10px; margin-bottom: 10px; }
        .stat-value { color: var(--navy); font-size: 25px; font-weight: 800; }
        .stat-note { color: #94A3B8; font-size: 9px; margin-top: 7px; }

        .main-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.55fr) minmax(260px, .85fr);
            gap: 20px;
            align-items: start;
        }

        .panel {
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 21px;
            margin-bottom: 20px;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 17px;
        }

        .panel-header h2 { color: var(--navy); font-size: 14px; margin: 0; }
        .panel-header a { color: var(--orange-dark); font-size: 10px; font-weight: 700; }

        .description {
            color: #64748B;
            font-size: 12px;
            line-height: 1.8;
            margin: 0;
        }

        .rating-summary {
            display: flex;
            align-items: center;
            gap: 17px;
            margin-bottom: 19px;
        }

        .rating-big { color: var(--navy); font-size: 39px; font-weight: 800; line-height: 1; }
        .stars { color: #F59E0B; letter-spacing: 2px; font-size: 14px; }
        .rating-count { color: var(--muted); font-size: 10px; margin-top: 5px; }

        .rating-row {
            display: grid;
            grid-template-columns: 35px 1fr 30px;
            align-items: center;
            gap: 9px;
            margin: 10px 0;
            color: #64748B;
            font-size: 10px;
        }

        .rating-track { height: 7px; background: #EDF1F5; border-radius: 10px; overflow: hidden; }
        .rating-fill { height: 100%; background: #F59E0B; border-radius: 10px; }

        .feedback-item {
            padding: 15px 0;
            border-bottom: 1px solid #EEF1F5;
        }

        .feedback-item:last-child { border-bottom: 0; padding-bottom: 0; }

        .feedback-top { display: flex; justify-content: space-between; gap: 10px; }
        .feedback-user { color: var(--navy); font-size: 11px; font-weight: 800; }
        .feedback-date { color: #94A3B8; font-size: 9px; }
        .feedback-item .stars { font-size: 11px; margin-top: 6px; }
        .feedback-text { color: #64748B; font-size: 11px; line-height: 1.7; margin: 8px 0 0; }

        .detail-list { margin: 0; }
        .detail-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 11px 0;
            border-bottom: 1px solid #EEF1F5;
            font-size: 10px;
        }

        .detail-row:last-child { border-bottom: 0; }
        .detail-row dt { color: var(--muted); }
        .detail-row dd { margin: 0; color: var(--navy); font-weight: 700; text-align: right; overflow-wrap: anywhere; }

        .owner-card { display: flex; align-items: center; gap: 11px; }
        .owner-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #EDE9FE;
            color: #6D28D9;
            display: grid;
            place-items: center;
            font-size: 12px;
            font-weight: 800;
        }

        .owner-name { color: var(--navy); font-size: 11px; font-weight: 800; }
        .owner-label { color: var(--muted); font-size: 9px; margin-top: 4px; }

        .info-note {
            padding: 13px;
            border-radius: 8px;
            background: #F8FAFC;
            color: #64748B;
            font-size: 10px;
            line-height: 1.6;
            margin-top: 15px;
        }

        @media (max-width: 1050px) {
            .main-grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 760px) {
            .sidebar { display: none; }
            .topbar { height: 62px; padding: 0 17px; }
            .content { padding: 24px 15px 40px; }
            .page-heading { flex-direction: column; }
            .page-heading h1 { font-size: 23px; }
            .website-hero { align-items: flex-start; flex-direction: column; padding: 19px; }
            .hero-status { text-align: left; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .stat-card { padding: 14px; }
            .stat-value { font-size: 22px; }
            .panel { padding: 17px; }
            .heading-actions { width: 100%; }
        }
    </style>
</head>
<body>

<div class="app-layout">

    <aside class="sidebar">
        <a href="/dashboard" class="brand">HUMAN<span>FEEDBACK</span></a>

        <div class="sidebar-label">WORKSPACE</div>
        <a href="/dashboard" class="nav-link"><span class="nav-icon">▦</span> Dashboard</a>
        <a href="/websites" class="nav-link active"><span class="nav-icon">◉</span> My Websites</a>
        <a href="/feedback" class="nav-link"><span class="nav-icon">✎</span> Feedback</a>
        <a href="/replies" class="nav-link"><span class="nav-icon">▤</span> Conversations</a>

        <div class="sidebar-label">ACCOUNT</div>
        <a href="/credits" class="nav-link"><span class="nav-icon">◈</span> Credits</a>
        <a href="/analytics" class="nav-link"><span class="nav-icon">▥</span> Analytics</a>
        <a href="/notifications" class="nav-link"><span class="nav-icon">♧</span> Notifications</a>
        <a href="/reports" class="nav-link"><span class="nav-icon">⚑</span> Reports</a>
        <a href="/profile" class="nav-link"><span class="nav-icon">◎</span> My Profile</a>
        <a href="/settings" class="nav-link"><span class="nav-icon">⚙</span> Settings</a>

        <div class="sidebar-bottom">
            <div class="user-box">
                <div class="avatar">HF</div>
                <div>
                    <div class="user-name">Account</div>
                    <div class="user-plan">Free Trial ·  Account</div>
                </div>
            </div>
        </div>
    </aside>

    <main class="main-content">
<section class="empty-state" role="status">
  <h1>No data available</h1>
  <p>Records will appear here when connected to the HUMAN FEEDBACK API.</p>
</section>
</main>
</div>

</body>
</html>
