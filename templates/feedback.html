
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - HUMAN FEEDBACK</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        :root {
            --navy: #172554;
            --navy-dark: #101B40;
            --orange: #F97316;
            --orange-dark: #EA580C;
            --text: #263247;
            --muted: #718096;
            --border: #E5EAF1;
            --background: #F8FAFC;
            --white: #FFFFFF;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--background);
            color: var(--text);
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        a { text-decoration: none; color: inherit; }

        .app-layout { min-height: 100vh; display: flex; }

        .sidebar {
            width: 255px;
            background: var(--navy-dark);
            color: white;
            padding: 25px 17px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .brand {
            font-size: 21px;
            font-weight: 800;
            padding: 0 12px 30px;
            letter-spacing: -.5px;
        }

        .brand span { color: var(--orange); }

        .sidebar-label {
            color: #8E9AB8;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.3px;
            padding: 13px 12px 9px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 9px;
            color: #C5CEE0;
            font-size: 13px;
            margin-bottom: 4px;
            transition: .2s;
        }

        .nav-link:hover, .nav-link.active {
            background: rgba(255,255,255,.10);
            color: white;
        }

        .nav-link.active {
            border-left: 3px solid var(--orange);
            padding-left: 9px;
        }

        .nav-icon { width: 19px; text-align: center; }

        .sidebar-bottom {
            margin-top: auto;
            border-top: 1px solid rgba(255,255,255,.12);
            padding-top: 18px;
        }

        .user-box { display: flex; align-items: center; gap: 10px; padding: 10px; }
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #FDE7D7;
            color: #9A3412;
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: 13px;
        }

        .user-name { font-size: 12px; font-weight: 700; }
        .user-plan { font-size: 10px; color: #AAB5CC; margin-top: 3px; }

        .main-content { flex: 1; min-width: 0; }

        .topbar {
            height: 72px;
            background: white;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
        }

        .breadcrumb { color: var(--muted); font-size: 12px; }
        .breadcrumb strong { color: var(--navy); }
        .topbar-right { display: flex; align-items: center; gap: 20px; }
        .top-icon { color: #64748B; font-size: 19px; }

        .top-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #FDE7D7;
            color: #9A3412;
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: 12px;
        }

        .content { max-width: 1200px; padding: 32px 35px 55px; margin: auto; }

        .page-heading {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 24px;
        }

        .page-heading h1 {
            color: var(--navy);
            font-size: 27px;
            margin: 0 0 8px;
            letter-spacing: -.7px;
        }

        .page-heading p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; }

        .btn {
            border: 0;
            border-radius: 8px;
            padding: 11px 15px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            display: inline-block;
        }

        .btn-primary { background: var(--orange); color: white; }
        .btn-primary:hover { background: var(--orange-dark); }
        .btn-secondary { background: white; border: 1px solid var(--border); color: #475569; }

        .-notice {
            background: #FFF7ED;
            border: 1px solid #FED7AA;
            color: #9A3412;
            border-radius: 9px;
            padding: 12px 15px;
            font-size: 11px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 22px;
        }

        .stat-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 11px;
            padding: 18px;
        }

        .stat-label { color: var(--muted); font-size: 10px; margin-bottom: 10px; }
        .stat-value { color: var(--navy); font-size: 25px; font-weight: 800; }
        .stat-note { color: #94A3B8; font-size: 9px; margin-top: 7px; }

        .tabs {
            display: flex;
            gap: 22px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 18px;
            overflow-x: auto;
        }

        .tab {
            padding: 13px 2px;
            color: #64748B;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
            border: 0;
            border-bottom: 2px solid transparent;
            background: none;
            cursor: pointer;
        }

        .tab.active { color: var(--orange-dark); border-bottom-color: var(--orange); }

        .filter-panel {
            display: flex;
            align-items: center;
            gap: 11px;
            flex-wrap: wrap;
            margin-bottom: 17px;
        }

        .search-box { flex: 1; min-width: 200px; position: relative; }

        .search-box input, .filter-select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: white;
            color: var(--text);
            font-size: 11px;
            outline: none;
        }

        .search-box input:focus, .filter-select:focus { border-color: var(--orange); }

        .filter-select { width: auto; min-width: 145px; }

        .feedback-list {
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        .list-header {
            padding: 17px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            gap: 10px;
        }

        .list-header h2 { font-size: 14px; color: var(--navy); margin: 0; }
        .list-header span { color: var(--muted); font-size: 10px; }

        .feedback-card {
            padding: 19px 20px;
            border-bottom: 1px solid #EEF1F5;
            transition: background .2s;
        }

        .feedback-card:last-child { border-bottom: 0; }
        .feedback-card:hover { background: #FCFCFD; }

        .feedback-top {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: flex-start;
        }

        .feedback-user { display: flex; align-items: center; gap: 11px; }

        .user-avatar {
            width: 37px;
            height: 37px;
            flex-shrink: 0;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: #EDE9FE;
            color: #6D28D9;
            font-size: 11px;
            font-weight: 800;
        }

        .user-avatar.orange { background: #FFEDD5; color: #9A3412; }
        .user-avatar.blue { background: #DBEAFE; color: #1D4ED8; }
        .user-avatar.pink { background: #FCE7F3; color: #BE185D; }

        .user-name { color: var(--navy); font-size: 11px; font-weight: 800; }
        .user-email { color: #94A3B8; font-size: 9px; margin-top: 4px; }

        .status {
            display: inline-block;
            border-radius: 20px;
            padding: 6px 9px;
            font-size: 9px;
            font-weight: 800;
            white-space: nowrap;
        }

        .status-approved { background: #ECFDF5; color: #047857; }
        .status-pending { background: #FFF7ED; color: #C2410C; }
        .status-rejected { background: #FEF2F2; color: #B91C1C; }

        .feedback-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin: 12px 0 8px 48px;
        }

        .stars { color: #F59E0B; font-size: 12px; letter-spacing: 1px; }
        .feedback-date { color: #94A3B8; font-size: 9px; }
        .website-label { color: #64748B; font-size: 9px; }

        .feedback-text {
            margin: 0 0 0 48px;
            color: #64748B;
            font-size: 11px;
            line-height: 1.7;
        }

        .feedback-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin: 14px 0 0 48px;
        }

        .reward { color: #64748B; font-size: 9px; }
        .reward strong { color: #047857; }

        .card-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .action-link { color: var(--orange-dark); font-size: 10px; font-weight: 700; }
        .action-link.secondary { color: #64748B; }

        .empty-state {
            display: none;
            text-align: center;
            padding: 45px 20px;
            color: var(--muted);
            font-size: 12px;
        }

        .pagination {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 10px;
        }

        .page-buttons { display: flex; gap: 6px; }
        .page-btn {
            width: 29px;
            height: 29px;
            border: 1px solid var(--border);
            background: white;
            color: #64748B;
            border-radius: 6px;
            font-size: 10px;
        }

        .page-btn.active { background: var(--navy); color: white; border-color: var(--navy); }

        @media (max-width: 1050px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 760px) {
            .sidebar { display: none; }
            .topbar { height: 62px; padding: 0 17px; }
            .content { padding: 24px 15px 40px; }
            .page-heading { flex-direction: column; }
            .page-heading h1 { font-size: 23px; }
            .stats-grid { gap: 10px; }
            .stat-card { padding: 14px; }
            .stat-value { font-size: 22px; }
            .filter-panel { align-items: stretch; }
            .search-box { min-width: 100%; }
            .filter-select { flex: 1; min-width: 0; }
            .feedback-card { padding: 16px 13px; }
            .feedback-meta, .feedback-text, .feedback-footer { margin-left: 0; }
            .feedback-footer { align-items: flex-start; flex-direction: column; }
            .feedback-top { align-items: flex-start; }
            .pagination { gap: 10px; flex-wrap: wrap; }
        }
    </style>
</head>
<body>

<div class="app-layout">

    <aside class="sidebar">
        <a href="/dashboard" class="brand">HUMAN<span>FEEDBACK</span></a>

        <div class="sidebar-label">WORKSPACE</div>
        <a href="/dashboard" class="nav-link"><span class="nav-icon">▦</span> Dashboard</a>
        <a href="/websites" class="nav-link"><span class="nav-icon">◉</span> My Websites</a>
        <a href="/feedback" class="nav-link active"><span class="nav-icon">✎</span> Feedback</a>
        <a href="/replies" class="nav-link"><span class="nav-icon">▤</span> Conversations</a>

        <div class="sidebar-label">ACCOUNT</div>
        <a href="/credits" class="nav-link"><span class="nav-icon">◈</span> Credits</a>
        <a href="/analytics" class="nav-link"><span class="nav-icon">▥</span> Analytics</a>
        <a href="/notifications" class="nav-link"><span class="nav-icon">♧</span> Notifications</a>
        <a href="/reports" class="nav-link"><span class="nav-icon">⚑</span> Reports</a>
        <a href="/profile" class="nav-link"><span class="nav-icon">◎</span> My Profile</a>
        <a href="/settings" class="nav-link"><span class="nav-icon">⚙</span> Settings</a>

        <div class="sidebar-bottom">
            <div class="user-box">
                <div class="avatar">HF</div>
                <div>
                    <div class="user-name">Account</div>
                    <div class="user-plan">Pro Plan ·  Account</div>
                </div>
            </div>
        </div>
    </aside>

    <main class="main-content">
<section class="empty-state" role="status">
  <h1>No data available</h1>
  <p>Records will appear here when connected to the HUMAN FEEDBACK API.</p>
</section>
</main>
</div>
</body>
</html>
